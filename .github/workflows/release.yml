# Builds, tests, signs (via SignPath, once configured) and publishes System Monitor.
#
#   Push a tag like v0.2.0      -> build + sign + create the GitHub Release with both downloads
#   Run manually (Actions tab)  -> build + sign only; files are attached to the run as artifacts
#
# Signing is skipped until the repository secret SIGNPATH_API_TOKEN and the variables below exist
# (see docs/signing.md). Until then the published files are unsigned.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # create the GitHub Release
  actions: read    # SignPath reads the uploaded build artifact

jobs:
  build:
    runs-on: windows-latest
    env:
      SIGNING_ENABLED: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\pip install -r requirements.txt -r requirements-dev.txt

      - name: Tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Select-String -Path sysmon\__init__.py -Pattern '__version__ = "([^"]+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match sysmon/__init__.py version $version" }

      - name: Tests
        shell: pwsh
        run: .venv\Scripts\python -m pytest -q

      - name: Build and self-test
        shell: pwsh
        run: .\build.ps1 -SkipPackage

      # --- Signing (SignPath Foundation) ---------------------------------------------------
      - name: Upload unsigned exes for signing
        id: unsigned
        if: env.SIGNING_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned
          path: |
            dist/SystemMonitor-portable.exe
            dist/SystemMonitor/SystemMonitor.exe

      - name: Sign with SignPath
        if: env.SIGNING_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Use signed exes
        if: env.SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          Copy-Item signed\SystemMonitor-portable.exe dist\ -Force
          Copy-Item signed\SystemMonitor\SystemMonitor.exe dist\SystemMonitor\ -Force
          foreach ($exe in "dist\SystemMonitor-portable.exe", "dist\SystemMonitor\SystemMonitor.exe") {
            $status = (Get-AuthenticodeSignature $exe).Status
            if ($status -ne "Valid") { throw "$exe signature: $status" }
          }

      # --- Package and publish ---------------------------------------------------------------
      - name: Package
        shell: pwsh
        run: .\tools\package-release.ps1

      - name: Attach files to this run
        uses: actions/upload-artifact@v4
        with:
          name: SystemMonitor-release
          path: build/release/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = if (Test-Path "docs/release-notes/${{ github.ref_name }}.md") { "docs/release-notes/${{ github.ref_name }}.md" } else { $null }
          $files = Get-ChildItem build/release | ForEach-Object { $_.FullName }
          if ($notes) {
            gh release create "${{ github.ref_name }}" @files --title "System Monitor ${{ github.ref_name }}" --notes-file $notes
          } else {
            gh release create "${{ github.ref_name }}" @files --title "System Monitor ${{ github.ref_name }}" --generate-notes
          }
